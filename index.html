<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>平和 (Peaceful Board)</title>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --bg-color: #000000;
      --card-bg: #16181c;
      --text-primary: #e7e9ea;
      --text-secondary: #71767b;
      --border-color: #2f3336;
      --accent-color: #1d9bf0;
      --pink-color: #f91880;
      --hover-bg: rgba(255, 255, 255, 0.03);
    }

    [data-theme="light"] {
      --bg-color: #ffffff;
      --card-bg: #f7f9f9;
      --text-primary: #0f1419;
      --text-secondary: #536471;
      --border-color: #eff3f4;
      --accent-color: #1d9bf0;
      --pink-color: #f91880;
      --hover-bg: rgba(0, 0, 0, 0.03);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      transition: background-color 0.2s, color 0.2s;
    }

    .app-container {
      display: flex;
      width: 100%;
      max-width: 1200px;
    }

    /* 左サイドバー */
    .sidebar-left {
      width: 275px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border-color);
      height: 100vh;
      position: sticky;
      top: 0;
    }

    .brand-logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-profile-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px;
      border-radius: 9999px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      cursor: pointer;
      margin-top: auto;
    }

    .user-profile-card img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-name {
      font-weight: bold;
      font-size: 0.9rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-handle {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    /* メインタイムライン */
    .main-timeline {
      flex: 1;
      max-width: 600px;
      border-right: 1px solid var(--border-color);
      min-height: 100vh;
    }

    .timeline-header {
      padding: 16px 20px;
      font-size: 1.2rem;
      font-weight: bold;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      background: var(--bg-color);
      backdrop-filter: blur(10px);
      z-index: 10;
    }

    /* 投稿フォーム */
    .tweet-box {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
    }

    .tweet-box-content {
      flex: 1;
    }

    .tweet-textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 1.1rem;
      resize: none;
      outline: none;
      min-height: 80px;
      margin-bottom: 12px;
    }

    .tweet-box-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }

    .post-submit-btn {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 8px 20px;
      border-radius: 9999px;
      font-weight: bold;
      cursor: pointer;
    }

    .post-submit-btn:hover {
      opacity: 0.9;
    }

    /* ツイートカード */
    .tweet-card {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      gap: 12px;
      animation: fadeIn 0.3s;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .tweet-content {
      flex: 1;
    }

    .tweet-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .tweet-author {
      font-weight: bold;
      font-size: 0.95rem;
    }

    .tweet-meta {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .tweet-text {
      font-size: 0.95rem;
      line-height: 1.5;
      word-break: break-word;
      margin-bottom: 8px;
    }

    .tweet-image {
      width: 100%;
      max-height: 350px;
      border-radius: 12px;
      object-fit: cover;
      margin-top: 8px;
    }

    .tweet-footer {
      display: flex;
      gap: 24px;
      margin-top: 12px;
      color: var(--text-secondary);
    }

    .tweet-action {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }

    .tweet-action:hover {
      color: var(--pink-color);
    }

    .tweet-action.liked {
      color: var(--pink-color);
    }

    .translate-link {
      background: none;
      border: none;
      color: var(--accent-color);
      font-size: 0.8rem;
      cursor: pointer;
      margin-top: 4px;
      display: block;
    }

    .translated-box {
      background: var(--hover-bg);
      border-left: 2px solid var(--accent-color);
      padding: 8px 12px;
      margin-top: 6px;
      font-size: 0.85rem;
      border-radius: 0 8px 8px 0;
    }

    .hashtag-link {
      color: var(--accent-color);
      cursor: pointer;
    }
    .hashtag-link:hover {
      text-decoration: underline;
    }

    /* 返信欄 */
    .replies-container {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
      display: none;
    }

    .reply-item {
      font-size: 0.85rem;
      margin-bottom: 6px;
      background: var(--hover-bg);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .reply-form {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .reply-input {
      flex: 1;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      outline: none;
    }

    .reply-btn {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.8rem;
      cursor: pointer;
    }

    /* 右サイドバー */
    .sidebar-right {
      width: 350px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow-y: auto;
    }

    .search-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 9999px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .search-input {
      background: transparent;
      border: none;
      color: var(--text-primary);
      outline: none;
      width: 100%;
      font-size: 0.9rem;
    }

    .widget {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px;
    }

    .widget-title {
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 12px;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 24px;
      border-radius: 16px;
      width: 90%;
      max-width: 500px;
    }

    .modal-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input, .form-select {
      width: 100%;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 0.95rem;
      outline: none;
    }

    .modal-submit {
      background: var(--accent-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 9999px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .notification-item {
      display: flex;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    @media (max-width: 1024px) {
      .sidebar-right { display: none; }
    }
    @media (max-width: 768px) {
      .sidebar-left { width: 80px; padding: 12px; }
      .sidebar-left .brand-logo span, .user-info, #sidebarBtnsContainer { display: none; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- 左サイドバー -->
    <aside class="sidebar-left">
      <div>
        <div class="brand-logo">
          <span>🕊️</span>
          <span>平和</span>
        </div>
        <button onclick="openNotificationsModal()" style="background: transparent; border: 1px solid var(--border-color); color: var(--text-primary); width: 100%; padding: 10px; border-radius: 9999px; cursor: pointer; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative;">
          🔔 通知
          <span id="notifBadge" style="position: absolute; top: 6px; right: 12px; background: var(--pink-color); color: white; border-radius: 50%; padding: 2px 6px; font-size: 0.65rem; display: none;">0</span>
        </button>
      </div>

      <div class="user-profile-card" onclick="openProfileModal()">
        <img id="sideAvatar" src="" alt="Avatar">
        <div class="user-info">
          <span id="sideName" class="user-name">読み込み中...</span>
          <span id="sideLang" class="user-handle">🌐 日本語</span>
        </div>
      </div>
    </aside>

    <!-- メインタイムライン -->
    <main class="main-timeline">
      <header class="timeline-header">
        <span>ホーム</span>
      </header>

      <!-- 投稿フォーム -->
      <div class="tweet-box">
        <img id="postAvatar" class="user-avatar" src="" alt="Avatar">
        <div class="tweet-box-content">
          <form id="tweetForm">
            <textarea id="tweetText" class="tweet-textarea" placeholder="いまどんな気持ち？平和な日常をつぶやこう..." required></textarea>
            
            <!-- プレビューエリア（画像・GIF対応） -->
            <div id="imagePreviewContainer" style="display: none; margin-bottom: 12px; position: relative; max-width: 100%;">
              <div id="previewWrapper"></div>
              <button type="button" id="removeImageBtn" style="position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.7); color: white; border: none; border-radius: 50%; width: 28px; height: 28px; cursor: pointer; font-weight: bold;">✕</button>
            </div>

            <div class="tweet-box-footer">
              <!-- 画像・GIF選択ボタン -->
              <input type="file" id="mediaInput" accept="image/*" style="display: none;">
              <button type="button" onclick="document.getElementById('mediaInput').click()" style="background: transparent; border: 1px solid var(--border-color); color: var(--accent-color); padding: 6px 14px; border-radius: 9999px; cursor: pointer; font-size: 0.85rem; font-weight: bold; display: flex; align-items: center; gap: 6px;">
                📷 画像・GIFを追加
              </button>
              
              <button type="submit" class="post-submit-btn">ポストする</button>
            </div>
          </form>
        </div>
      </div>

      <!-- タイムライン一覧 -->
      <div id="tweetList"></div>
    </main>

    <!-- 右サイドバー -->
    <aside class="sidebar-right">
      <div class="search-box">
        <i>🔍</i>
        <input type="text" id="searchInput" class="search-input" placeholder="キーワードや #ハッシュタグ で検索" oninput="onSearchInput(this.value)">
        <button id="clearSearchBtn" onclick="clearSearch()" style="background:none; border:none; color:var(--text-secondary); cursor:pointer; display:none;">✕</button>
      </div>

      <div class="widget">
        <div class="widget-title">🌍 世界の平和の様子</div>
        <div id="worldTimeWidget" style="font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px;">
          <!-- worldtime.jsによって自動生成されます -->
        </div>
      </div>
    </aside>
  </div>

  <!-- プロフィール編集モーダル -->
  <div id="profileModal" class="modal-overlay">
    <div class="modal-content">
      <div class="modal-title">
        <span>プロフィール編集</span>
        <button onclick="closeModal('profileModal')" style="background:none; border:none; color:var(--text-primary); cursor:pointer; font-size: 1.1rem;">✕</button>
      </div>
      <form id="profileForm">
        <div class="form-group">
          <label class="form-label">表示名</label>
          <input type="text" id="inputName" class="form-input" required>
        </div>
        <div class="form-group">
          <label class="form-label">アバター画像URL</label>
          <input type="url" id="inputAvatarUrl" class="form-input" placeholder="https://...">
        </div>
        <div class="form-group">
          <label class="form-label">または画像ファイルを選択</label>
          <input type="file" id="inputAvatarFile" class="form-input" accept="image/*" style="padding: 6px;">
        </div>
        <div class="form-group">
          <label class="form-label">母国語 / 言語</label>
          <select id="inputLang" class="form-select">
            <option value="ja">🇯🇵 日本語 (Japanese)</option>
            <option value="en">🇺🇸 英語 (English)</option>
            <option value="ko">🇰🇷 韓国語 (Korean)</option>
            <option value="zh">🇨🇳 中国語 (Chinese)</option>
            <option value="es">🇪🇸 スペイン語 (Spanish)</option>
            <option value="fr">🇫🇷 フランス語 (French)</option>
            <option value="de">🇩🇪 ドイツ語 (German)</option>
          </select>
        </div>
        <button type="submit" class="modal-submit">保存する</button>
      </form>
    </div>
  </div>

  <!-- 通知モーダル -->
  <div id="notificationsModal" class="modal-overlay">
    <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
      <div class="modal-title">
        <span>通知</span>
        <button onclick="closeModal('notificationsModal')" style="background:none; border:none; color:var(--text-primary); cursor:pointer; font-size: 1.1rem;">✕</button>
      </div>
      <div id="notificationList"></div>
    </div>
  </div>

  <!-- 各種プラグインの読み込み -->
  <script src="./i18n.js"></script>
  <script src="./theme.js"></script>
  <script src="./worldtime.js"></script>

  <!-- Firebase SDK の読み込み -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- メイン処理 (app.js) -->
  <script src="./app.js"></script>
</body>
</html>
